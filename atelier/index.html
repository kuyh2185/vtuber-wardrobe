<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>버튜버 옷 만들기</title>
<meta name="description" content="내 VRM 캐릭터 몸에 맞춰 옷을 직접 바꾸고, 시청자와 고르고, 파일로 받아요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#16131d; --ink2:#201b2b; --line:#3a3347; --mute:#a59db4; --text:#f4f0ea; --hot:#ff5c9a; --gold:#e5bc63;
  --panel:380px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font:15px/1.5 "Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
#stage{position:fixed;inset:0 var(--panel) 0 0;background:radial-gradient(70% 60% at 50% 42%,#3b2f4e 0,#221c2e 58%,#16131d 100%)}
#stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:20px;top:18px;pointer-events:none;font-weight:800;letter-spacing:-.02em;font-size:18px}
#hud small{display:block;font-weight:500;font-size:13px;color:var(--mute);letter-spacing:0}
#tag{position:absolute;left:20px;bottom:18px;max-width:calc(100% - 40px);font-size:13px;color:var(--mute);pointer-events:none}
#badge{position:absolute;right:20px;top:18px;padding:6px 12px;border-radius:999px;background:#0008;font-weight:700;font-size:13px;display:none}
#badge.show{display:block}
#badge.bad{color:#ffb4a8;border:1px solid #ff6b57}
#badge.good{color:#a7f0d5;border:1px solid #35c996}
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel);background:var(--ink2);border-left:1px solid var(--line);display:flex;flex-direction:column}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
nav button{padding:12px 0 10px;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer}
nav button b{display:block;font-size:16px;line-height:1.1}
nav button[aria-current=step]{color:var(--text);border-bottom-color:var(--hot)}
nav button:hover{color:var(--text)}
#body{flex:1;overflow:auto;padding:20px 20px 12px}
h2{margin:0 0 6px;font-size:21px;line-height:1.3;letter-spacing:-.02em}
p.lead{margin:0 0 18px;color:var(--mute);font-size:14px}
h3{margin:20px 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.pick{display:grid;gap:8px}
.card{display:block;width:100%;padding:11px 13px;background:#ffffff08;border:1px solid var(--line);border-radius:10px;text-align:left;cursor:pointer}
.card b{display:block;font-size:15px}
.card span{display:block;font-size:12.5px;color:var(--mute);line-height:1.4;margin-top:2px}
.card:hover{border-color:#6a5e7d}
.card[aria-pressed=true]{border-color:var(--hot);background:#ff5c9a18}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .card{text-align:center;padding:9px 4px}
label.s{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:0 0 13px;font-size:14px}
label.s i{font-style:normal;color:var(--mute);font-size:12px}
label.s input{grid-column:1/-1;width:100%;accent-color:var(--hot);height:22px;margin:0}
.tg{display:flex;gap:8px;flex-wrap:wrap}
.tg button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px}
.tg button[aria-pressed=true]{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:700}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid #fff3;cursor:pointer;padding:0}
.sw button[aria-pressed=true]{outline:2px solid var(--text);outline-offset:2px}
input[type=text]{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#0003}
.nums{display:grid;gap:0;margin:12px 0}
.nums div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.nums b{font-size:18px;font-variant-numeric:tabular-nums}
.vote{margin:0 0 14px}
.vote b{display:block;margin-bottom:6px;font-size:14px}
.bar{position:relative;height:30px;margin-bottom:5px;border-radius:7px;background:#ffffff0c;overflow:hidden;font-size:13px}
.bar i{position:absolute;inset:0 auto 0 0;background:#ff5c9a55}
.bar.win i{background:var(--hot)}
.bar span{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-variant-numeric:tabular-nums}
.go{width:100%;padding:13px;border-radius:10px;border:0;background:var(--hot);color:#23060f;font-weight:800;cursor:pointer;font-size:15px}
.go.alt{background:none;border:1px solid var(--line);color:var(--text);font-weight:600;margin-top:8px}
.go:disabled{opacity:.45;cursor:default}
.note{font-size:12.5px;color:var(--mute);margin:12px 0 0}
footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
footer button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600}
footer button.next{background:var(--text);color:var(--ink);border-color:var(--text)}
footer button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:5;font-weight:700}
#load.off{display:none}
@media (max-width:820px){
  html,body{overflow:auto}
  #stage{position:relative;inset:auto;height:56svh}
  #panel{position:relative;width:auto;border-left:0}
  #body{overflow:visible}
  #tag{left:20px;top:64px;bottom:auto;max-width:112px;font-size:12px}
  #badge{top:auto;right:auto;left:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"
}}</script>
</head>
<body>
<div id="load" role="status">캐릭터를 불러오는 중이에요</div>
<main id="stage" aria-label="옷을 입은 캐릭터 미리보기">
  <div id="hud"><span id="hudT"></span><small id="hudS"></small></div>
  <div id="badge" role="status"></div>
  <div id="tag">끌어서 돌려 보고, 휠로 확대해요</div>
</main>
<aside id="panel">
  <nav id="nav" aria-label="만드는 순서"></nav>
  <div id="body"></div>
  <footer><button id="prev">이전</button><button id="next" class="next">다음</button></footer>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
